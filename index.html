<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔥 Hano Tay Vatosoa ! 🔥</title>

  <!-- Police Pop / BD -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Montserrat:wght@800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #ff007f, #7928ca, #00dfd8);
      background-size: 400% 400%;
      animation: gradientBG 8s ease infinite;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Fredoka One', cursive;
      overflow: hidden;
      position: relative;
    }

    /* Animation du fond dégradé */
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* --- PLUIE DE PETITES TÊTES EN ARRIÈRE-PLAN --- */
    .floating-heads-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .bg-head {
      position: absolute;
      bottom: -100px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      animation: floatUp 6s linear infinite;
      opacity: 0.85;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }

    /* --- CARTE PRINCIPALE --- */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 35px;
      padding: 40px 30px;
      text-align: center;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      transform: scale(0.8);
      animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      to { transform: scale(1); }
    }

    /* --- TEXTE "HANO TAY" --- */
    .title-hano {
      font-size: 3.5rem;
      color: #ff007f;
      text-shadow: 3px 3px 0px #000;
      letter-spacing: 2px;
      animation: bounce 1.2s infinite alternate ease-in-out;
    }

    /* --- TEXTE "VALISOA" --- */
    .title-valisoa {
      font-size: 4rem;
      color: #00dfd8;
      text-shadow: 4px 4px 0px #000;
      margin-bottom: 20px;
      display: inline-block;
      animation: pulseText 0.6s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-12px); }
    }

    @keyframes pulseText {
      from { transform: scale(1) rotate(-2deg); }
      to { transform: scale(1.1) rotate(2deg); }
    }

    /* --- IMAGE PRINCIPALE DU VISAGE --- */
    .head-container {
      margin: 15px 0;
      display: inline-block;
      position: relative;
    }

    .main-head {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #ff007f;
      box-shadow: 0 10px 25px rgba(255, 0, 127, 0.5);
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: headBounce 2s infinite ease-in-out;
    }

    .main-head:hover {
      transform: scale(1.2) rotate(10deg);
      border-color: #00dfd8;
    }

    @keyframes headBounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
    }

    p.subtitle {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      color: #333;
      font-size: 1.2rem;
      margin-bottom: 25px;
    }

    /* --- BOUTON INTERACTIF --- */
    .btn-action {
      background: #ff007f;
      color: white;
      border: 4px solid #000;
      padding: 15px 35px;
      font-size: 1.5rem;
      font-family: 'Fredoka One', cursive;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 0 #000;
      transition: all 0.1s ease;
    }

    .btn-action:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #000;
    }

    /* --- PETITES TÊTES VOLANTES SUR CLIC --- */
    .flying-head {
      position: fixed;
      pointer-events: none;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ff007f;
      z-index: 100;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      animation: headFlyUp 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes headFlyUp {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.6) rotate(0deg);
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(var(--x), var(--y)) scale(1.5) rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <!-- Conteneur pour les têtes volantes en arrière-plan -->
  <div class="floating-heads-container" id="bgHeads"></div>

  <div class="card" id="card">
    <div class="title-hano">HANO TAY!</div>
    <div class="title-valisoa">VATOSOA</div>
    
    <div class="head-container">
      <img src="cUjx7MAn.jpeg" alt="Valisoa" class="main-head" id="mainHead" onclick="clicHanoTay(event)">
    </div>

    <p class="subtitle">MANDANSA / ALEFAAAAA ! 🚀</p>

    <button class="btn-action" onclick="clicHanoTay(event)">HANO TAY ! 🔥</button>
  </div>

  <script>
    const imageName = "cUjx7MAn.jpeg";

    // --- GENERER LA PLUIE DE PETITES TETES EN ARRIERE-PLAN ---
    const bgContainer = document.getElementById('bgHeads');
    const totalBgHeads = 20;

    for (let i = 0; i < totalBgHeads; i++) {
      const head = document.createElement('img');
      head.src = imageName;
      head.className = 'bg-head';
      
      const size = Math.floor(Math.random() * 35) + 30; // 30px à 65px
      const left = Math.random() * 100; // 0% à 100%
      const duration = Math.random() * 4 + 4; // 4s à 8s
      const delay = Math.random() * 5; // 0s à 5s

      head.style.width = size + 'px';
      head.style.height = size + 'px';
      head.style.left = left + 'vw';
      head.style.animationDuration = duration + 's';
      head.style.animationDelay = delay + 's';

      bgContainer.appendChild(head);
    }

    // --- ANIMATION D'EXPLOSION DE TÊTES AU CLIC ---
    function clicHanoTay(event) {
      const mainHead = document.getElementById('mainHead');

      // Effet d'impulsion sur la tête principale
      mainHead.style.transform = 'scale(1.4) rotate(15deg)';
      setTimeout(() => {
        mainHead.style.transform = '';
      }, 200);

      // Coordonnées du clic
      const rect = event.target.getBoundingClientRect();
      const originX = event.clientX || (rect.left + rect.width / 2);
      const originY = event.clientY || (rect.top + rect.height / 2);

      // Générer plein de petites têtes qui s'envolent
      const count = 15;
      for (let i = 0; i < count; i++) {
        const flyingHead = document.createElement('img');
        flyingHead.src = imageName;
        flyingHead.className = 'flying-head';

        flyingHead.style.left = (originX - 22) + 'px';
        flyingHead.style.top = (originY - 22) + 'px';

        const xDir = (Math.random() - 0.5) * 350;
        const yDir = -(Math.random() * 300 + 150);

        flyingHead.style.setProperty('--x', xDir + 'px');
        flyingHead.style.setProperty('--y', yDir + 'px');

        document.body.appendChild(flyingHead);

        setTimeout(() => flyingHead.remove(), 1200);
      }
    }
  </script>

</body>
</html>
